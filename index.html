<!doctype html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/camila_decora_logo.svg" />

  <!-- Preload imagem de fundo crítica -->
  <link rel="preload" as="image" href="/assets/imagens/fundo.webp" type="image/webp" />
  <link rel="preload" as="image" href="/assets/imagens/logo.webp" type="image/webp" />

  <title>Guia de Decoração | Camila Decora</title>

  <meta name="description"
    content="Descubra como transformar sua casa com elegância, estilo e baixo custo. Um guia para decorar com personalidade e autenticidade." />

  <!-- Open Graph -->
  <meta property="og:title" content="Guia de Decoração | Camila Decora" />
  <meta property="og:description"
    content="Aprenda como decorar sua casa com estilo e praticidade. Inspire-se com ideias acessíveis e cheias de personalidade." />
  <meta property="og:image" content="https://yasminlino.github.io/assets/imagens/og-camila.jpg" />
  <meta property="og:url" content="https://yasminlino.github.io/" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Guia de Decoração | Camila Decora" />
  <meta name="twitter:description"
    content="Transforme sua casa com estilo e economia. Um guia exclusivo para decorar com alma." />
  <meta name="twitter:image" content="https://yasminlino.github.io/assets/imagens/og-camila.jpg" />

  <!-- ✅ Google Fonts (pré-conexão e pré-carregamento com swap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- DM Serif Display (título principal) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet" media="print"
    onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet" />
  </noscript>

  <!-- Poppins (texto) -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100..900;1,100..900&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
  </noscript>

  <!-- Outfit (secundária) -->
  <!-- Preload da fonte principal -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" as="style"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap">
  </noscript>


  <!-- GTM performance -->
  <link rel="preconnect" href="https://www.googletagmanager.com" />
  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

  <!-- Google Tag Manager adiado -->
  <script>
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });

    window.addEventListener('load', () => {
      setTimeout(() => {
        const gtm = document.createElement('script');
        gtm.async = true;
        gtm.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-WBBNTGTH';
        document.head.appendChild(gtm);
      }, 1500);
    });
  </script>
</head>

<body>
  <!-- GTM fallback -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WBBNTGTH" height="0" width="0"
      style="display:none;visibility:hidden"></iframe>
  </noscript>

  <!-- SPA root -->
  <div id="root"></div>

  <!-- Entrada principal do React -->
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
